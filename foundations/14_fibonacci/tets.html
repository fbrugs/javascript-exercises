<body>
    <script>

        function fibonacci(arg) {
            let num1 = 1;
            let num2 = 1;
            let answer;
            
            for (let i = 2; i < arg; i++) {
                answer = num1 + num2;
                num1 = num2;
                num2 = answer
            }

            return num2

        }

        console.log(fibonacci(6))

    </script>
